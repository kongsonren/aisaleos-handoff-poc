name: KR-CUT39-ISOLATED-ACCEPTANCE
on:
  workflow_dispatch:
    inputs:
      schedule_key:
        description: Durable isolated outbox key
        required: true
        type: string
permissions:
  contents: write
  actions: write
jobs:
  isolated:
    if: github.ref == 'refs/heads/kr-cut39-isolated-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute durable scheduler regression and next runner ACK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE_KEY: ${{ inputs.schedule_key }}
        run: python .wb1/kr-cut39/cloud_accept.py
